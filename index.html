<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>춘복이네 집밥상점</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  html, body {
    height: 100%;
  }

  body {
    background-color: #FBF7EF; /* 따뜻한 아이보리 배경 */
    font-family: "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 24px;
  }

  .brand {
    font-size: 2.4rem;
    font-weight: 700;
    color: #3B2A1E;
    letter-spacing: -0.02em;
    margin-bottom: 16px;
  }

  .tagline {
    font-size: 1.1rem;
    font-weight: 400;
    color: #6B5B4D;
  }

  @media (max-width: 480px) {
    .brand {
      font-size: 1.7rem;
    }

    .tagline {
      font-size: 0.95rem;
    }
  }
</style>
</head>
<body>
  <div>
    <div class="brand">춘복이네 집밥상점</div>
    <div class="tagline">우리 집 밥상에 올리고 싶은 먹거리를 소개합니다.</div>
  </div>
</body>
</html>
