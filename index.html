<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>춘복이네 집밥상점</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
  }
  body {
    font-family: "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    color: #4A3728;
  }
  * {
    box-sizing: border-box;
  }

  /* 상단 메뉴 */
  header {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    padding: 16px 24px;
  }
  header nav a {
    margin-left: 16px;
    color: inherit;
    text-decoration: none;
  }

  /* 각 섹션 공통 */
  section {
    padding: 40px 24px;
  }

  /* 이미지/상품 자리 표시용 임시 박스 */
  .placeholder-box {
    border: 1px dashed #999;
    padding: 40px;
    text-align: center;
    color: #999;
  }

  footer {
    padding: 24px;
  }
</style>
</head>
<body>

<header>
  <div>춘복이네 집밥상점</div>
  <nav>
    <a href="#about">춘복이네 소개</a>
    <a href="#products">판매상품</a>
    <a href="#criteria">우리가 고르는 기준</a>
    <a href="#buy">구매처</a>
  </nav>
</header>

<!-- 메인 영역 -->
<section id="top">
  <h1>춘복이네 집밥상점</h1>
  <p>우리 집 밥상에 올리고 싶은 먹거리를 소개합니다.</p>
  <div class="placeholder-box">이미지가 들어갈 자리</div>
</section>

<!-- 춘복이네 소개 -->
<section id="about">
  <h2>춘복이네 집밥상점은</h2>
  <p>소개 문구가 들어갈 자리입니다.</p>
</section>

<!-- 판매상품 -->
<section id="products">
  <h2>춘복이네가 소개하는 먹거리</h2>
  <div class="placeholder-box">상품이 들어갈 자리</div>
</section>

<!-- 우리가 고르는 기준 -->
<section id="criteria">
  <h2>춘복이네가 먹거리를 고르는 기준</h2>
  <div class="placeholder-box">내용이 들어갈 자리</div>
</section>

<!-- 구매처 -->
<section id="buy">
  <h2>춘복이네 상품 만나보기</h2>
  <div class="placeholder-box">판매처 링크가 들어갈 자리</div>
</section>

<!-- 하단 영역 -->
<footer>
  <div>춘복이네 집밥상점</div>
  <div class="placeholder-box">사업자정보가 들어갈 자리</div>
</footer>

</body>
</html>
