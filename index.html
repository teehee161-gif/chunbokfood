<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>춘복이네 집밥상점</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
  }
  body {
    font-family: "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    color: #4A3728;
    background: #FAF6EF;
  }
  * {
    box-sizing: border-box;
  }

  /* 콘텐츠 공통 폭 */
  .container {
    max-width: 1440px;
    margin: 0 auto;
    padding: 0 64px;
  }

  /* 상단 메뉴 */
  header {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    padding: 32px 64px;
    border-bottom: 1px solid #E3DACB;
  }
  header > div {
    font-weight: 600;
    font-size: 19px;
    letter-spacing: -0.01em;
  }
  header nav a {
    margin-left: 32px;
    color: #4A3728;
    text-decoration: none;
    font-size: 14px;
  }

  /* 메인 Hero 영역 */
  .hero {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 24px;
    padding: 88px 0 100px;
  }
  .hero-text {
    flex: 1 1 42%;
    max-width: 42%;
  }
  .hero-text h1 {
    font-size: 44px;
    line-height: 1.45;
    letter-spacing: -0.02em;
    margin: 0 0 22px;
    font-weight: 600;
  }
  .hero-text p {
    font-size: 16px;
    line-height: 1.7;
    color: #6B5B45;
    margin: 0 0 36px;
    font-weight: 400;
  }
  .hero-image {
    flex: 1 1 58%;
    max-width: 58%;
  }
  .hero-image .placeholder-box {
    aspect-ratio: 4 / 3;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #F1EAD9;
    border-color: #C9BC9E;
    color: #8A7A5E;
    padding: 0;
  }
  .hero-image img {
    width: 100%;
    aspect-ratio: 4 / 3;
    object-fit: cover;
    object-position: center;
    display: block;
    border-radius: 2px;
  }
  .btn {
    display: inline-block;
    padding: 15px 34px;
    background: #3D5C42;
    color: #FAF6EF;
    text-decoration: none;
    font-size: 14px;
    letter-spacing: 0.02em;
    border-radius: 2px;
  }
  @media (max-width: 900px) {
    header {
      padding: 20px 24px;
    }
    .container {
      padding: 0 24px;
    }
    .hero {
      padding: 48px 0 56px;
      gap: 32px;
    }
    .hero-text, .hero-image {
      flex: 1 1 100%;
      max-width: 100%;
    }
    .hero-text h1 {
      font-size: 28px;
    }
  }

  /* 각 섹션 공통 */
  section {
    padding: 40px 24px;
  }

  /* 이미지/상품 자리 표시용 임시 박스 */
  .placeholder-box {
    border: 1px dashed #999;
    padding: 40px;
    text-align: center;
    color: #999;
  }

  footer {
    padding: 24px;
  }
</style>
</head>
<body>

<header>
  <div>춘복이네 집밥상점</div>
  <nav>
    <a href="#about">춘복이네 소개</a>
    <a href="#products">판매상품</a>
    <a href="#criteria">우리가 고르는 기준</a>
    <a href="#buy">구매처</a>
  </nav>
</header>

<!-- 메인 영역 -->
<section id="top">
  <div class="hero container">
    <div class="hero-text">
      <h1>매일 먹는 밥상이니까<br>조금 더 맛있는 것을 고릅니다.</h1>
      <p>우리 집 밥상에 올리고 싶은 먹거리를 소개합니다.</p>
      <a href="#products" class="btn">판매상품 보기</a>
    </div>
    <div class="hero-image">
      <img src="main-kimchi.jpg" alt="춘복이네 맛김치">
    </div>
  </div>
</section>

<!-- 춘복이네 소개 -->
<section id="about">
  <div class="container">
    <h2>춘복이네 집밥상점은</h2>
    <p>소개 문구가 들어갈 자리입니다.</p>
  </div>
</section>

<!-- 판매상품 -->
<section id="products">
  <h2>춘복이네가 소개하는 먹거리</h2>
  <div class="placeholder-box">상품이 들어갈 자리</div>
</section>

<!-- 우리가 고르는 기준 -->
<section id="criteria">
  <h2>춘복이네가 먹거리를 고르는 기준</h2>
  <div class="placeholder-box">내용이 들어갈 자리</div>
</section>

<!-- 구매처 -->
<section id="buy">
  <h2>춘복이네 상품 만나보기</h2>
  <div class="placeholder-box">판매처 링크가 들어갈 자리</div>
</section>

<!-- 하단 영역 -->
<footer>
  <div>춘복이네 집밥상점</div>
  <div class="placeholder-box">사업자정보가 들어갈 자리</div>
</footer>

</body>
</html>
